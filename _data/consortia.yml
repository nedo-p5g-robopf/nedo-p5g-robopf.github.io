- id: aist
  name: 産業技術総合研究所コンソ
  number: "01"
  en: QUALITY & DEVELOPMENT
  role: 品質管理・開発支援ツール
  tagline: 品質・信頼性・安全性を、開発の各工程へ。
  description: ソフトウェアの品質・セキュリティ向上と、ロボットシステムの設計・開発・検証を支援する基盤を構築します。現場導入に役立つリファレンスシステムや教示支援ツールを組み合わせ、ロボットSIの効率化を目指します。
  topics:
    - 品質・セキュリティ向上
    - 設計・開発・検証の支援
    - 現場導入・教示の支援
  initiatives:
    - title: 開発品質を支えるツールと制御基盤
      description: ソースコードの品質確認、ROS 2ノード設計、多自由度協調制御、リアルタイム実行環境を開発し、モジュールの実装と再利用を支援します。
    - title: 設計・検証から安全性を支える
      description: システム設計、通信環境検証、作業・安全設計、柔軟物シミュレーション、統合検証、LLMによるリスクアセスメント支援に取り組みます。
    - title: 現場での活用につなぐリファレンス
      description: FMS、工程間搬送、移動ロボットのリファレンスシステムや、エンドユーザーが動作を変更できる教示ツールを開発します。
  benefit: ロボットSIerの設計・検証の負担軽減と、ハード・ソフトメーカーの技術を組み合わせやすい開発環境の実現を目指します。
- id: kawasaki
  name: 川崎重工業コンソ
  number: "02"
  en: COMMON PLATFORM & MODULES
  role: 共通アーキテクチャ・基本機能
  tagline: つなぐ・つくる・試す・広げる、共創型の基盤へ。
  description: メーカーに依存しないソフトウェアモジュールやAI開発環境、遠隔保守ツールを備えたロボット開発・運用基盤を構築します。共通アーキテクチャと管理機能のもとで、異なるロボットや設備をつなぎ、開発成果の再利用と流通を促進します。
  topics:
    - メーカーに依存しない接続
    - ソフトウェア開発・運用基盤
    - モジュールの再利用・流通
  initiatives:
    - title: 共通アーキテクチャと開発・管理環境
      description: 標準インターフェースやデータ仕様を整備し、機器・ソフトウェアを管理する共通基盤、ローコード／ノーコード開発環境、建物OSとの連携に取り組みます。
    - title: 多様なロボットの機能をモジュール化
      description: AIによる認識・判断、AMRの搬送支援、視触覚ハンド、リニアコンベア・スカラロボットなどの機能を、ROS 2等を通じて組み合わせられる形に整えます。
    - title: 現場実証と遠隔運用・保守
      description: 多品種少量生産の部品準備やピック＆プレイス等で開発成果を実証。異種ロボットの統合制御、遠隔教示、データ収集・AI調整、遠隔監視・更新を支援します。
  benefit: SIerは共通部品を活かして構築を効率化し、ハード・ソフトメーカーは自社の機能を他社の技術と接続することで、採用機会や適用先の拡大を目指せます。
- id: takenaka
  name: 竹中工務店コンソ
  number: "03"
  en: ROBOTICS FOR CONSTRUCTION
  role: 建設業界向けモジュール・ツール
  tagline: 変わり続ける建設現場に、使い続けられるロボットを。
  description: ロングテール市場である建設業を対象に、共通アーキテクチャ、標準ソフトウェア・ハードウェア、通信インフラ、仮想検証環境、運用支援を統合した開発基盤を構築します。「デジタル・ロボットシステム技術基盤構築事業」とも連携し、実用性と波及性の高い基盤を目指します。
  topics:
    - 建設業のユースケース
    - 標準モジュールと通信基盤
    - 仮想検証・運用支援
  initiatives:
    - title: 共通設計と標準モジュール
      description: 建設ロボットの設計・運用ガイドラインを策定。自己位置推定・地図作成・経路計画などの自律走行機能と、機器の取付・電源・通信をつなぐ標準ハードウェアを開発します。
    - title: 現場の変化に対応する通信と事前検証
      description: 移設しやすいローカル5G・メッシュWi-Fiの通信基盤を構築。BIMや現場の3Dデータを取り込むシミュレーションで、搬入前の動作検証を支援します。
    - title: 異機種ロボットの運用を一元管理
      description: マップ表示、稼働監視、タスク・現場・保守管理を行う運用支援ツールを開発。資材搬送、清掃、設備検査、墨出し等の建設現場での活用を見据えます。
  benefit: SIerの現場調整や検証の負担を減らし、ロボットメーカーの既存技術を建設現場へ展開しやすくすることで、用途ごとの個別開発の効率化を目指します。
