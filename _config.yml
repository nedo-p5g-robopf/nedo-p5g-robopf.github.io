title: ロボティクスソフトウェア開発基盤
description: ロボットSI効率化に向けた、品質・信頼性・安全性強化型ソフトウェア開発基盤。設計から開発、検証、現場運用まで、研究成果と活用の可能性をご紹介します。
url: https://nedo-p5g-robopf.github.io
baseurl: ""
lang: ja
timezone: Asia/Tokyo
encoding: utf-8
markdown: kramdown
permalink: pretty
repository: nedo-p5g-robopf/nedo-p5g-robopf.github.io
collections:
  research:
    output: true
    permalink: /research/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: research
    values:
      layout: research
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - vendor
  - test-results
  - package.json
  - package-lock.json
strict_front_matter: true
liquid:
  error_mode: strict
